:root{

  --tx:#EFE7D6;--mut:#9C937F;--bad:#E4675E;--ok:#74C27A;--warn:#E6AE45;
  --accN:#C9A24A;--accD:#86661A;--acc:var(--accN);--onacc:#0B0906;

html[data-mode=day]{--bg:#F4F1EA;--surf:#FFFFFF;--surf2:#ECE7DC;--tx:#1C1913;--mut:#665F50;--acc:var(--accD);--line:rgba(0,0,0,.14);--onacc:#FFFFFF;--bad:#B63A32;--ok:#2E7D32;--warn:#9A6400;color-scheme:light}
html,body{background:var(--bg);color:var(--tx);font-family:var(--fs);font-size:16px;line-height:1.5;min-height:100%}
body{padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.skip{position:absolute;inset-inline-start:-999px;top:0}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) max(12px,calc((100% - 560px)/2 + 12px)) 10px;background:var(--bg);border-bottom:1px solid var(--line)}

.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:1.15rem;flex:none}

.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--acc);color:var(--acc);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.25}
.btn.pri{background:var(--acc);color:var(--onacc)}
.btn.big{min-height:56px;font-size:1.08rem}
.btn.wide{width:100%}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.pri.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.link{color:var(--acc);text-decoration:underline;padding:10px;font-size:.95rem}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--tx)}
.inp:focus{border-color:var(--acc);outline:none}
select.inp{appearance:auto}
textarea.inp{min-height:110px;resize:vertical}
.mono{font-family:var(--fm);letter-spacing:.02em}
.lbl{display:block;font-size:.88rem;color:var(--mut);margin:12px 0 6px}
.pwbox{position:relative;direction:ltr}
.pwbox .inp{padding-right:52px}
.pwbox .eye{position:absolute;right:4px;top:4px;width:44px;height:40px;border-radius:10px}
.err{color:var(--bad);min-height:1.4em;font-size:.92rem;margin-top:6px}
.meter{height:6px;border-radius:3px;background:var(--surf2);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .2s}
.mlbl{font-size:.84rem;color:var(--mut);margin-top:4px}
.search{margin:6px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:4px;background:var(--surf);min-height:96px}
.tile .ti{font-size:1.4rem;line-height:1}
.tile b{font-weight:600;font-size:.98rem;line-height:1.3}
.tile small{color:var(--mut);font-size:.84rem}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:0}
.tile.wide .tx{flex:1}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{margin:24px 0 10px;font-family:var(--fd);font-size:1.08rem;color:var(--acc);font-weight:600}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surf);margin-bottom:10px}
.card p{line-height:1.6}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surf);margin-bottom:8px;text-align:start;user-select:none;-webkit-user-select:none}
.row .ic{font-size:1.35rem;width:36px;text-align:center;flex:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt small{display:block;color:var(--mut);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ra{display:flex;gap:6px;flex:none}
.star{color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:36px 16px;line-height:1.6}
.fld{border-bottom:1px solid var(--line);padding:12px 0}
.fld:last-child{border-bottom:0}
.fld>label{display:block;font-size:.82rem;color:var(--mut)}
.fline{display:flex;align-items:center;gap:6px}
.fv{flex:1;min-width:0;word-break:break-all;font-size:1.05rem;padding:4px 0}
.fv.pre{white-space:pre-wrap;word-break:break-word}
.fa{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:1rem}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.badge{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.b-bad{color:var(--bad)}.b-ok{color:var(--ok)}.b-warn{color:var(--warn)}.b-mut{color:var(--mut)}
.banner{border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin:0 0 14px;display:flex;gap:10px;align-items:center;background:var(--surf)}
.banner p{flex:1;font-size:.92rem;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);font-size:.92rem}
.seg button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);font-weight:700;box-shadow:inset 0 0 0 1px var(--acc)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.sw i{width:22px;height:22px;border-radius:50%;display:block}
.sw[aria-pressed=true]{border-color:var(--tx);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc)}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0;line-height:1.4}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.foot{text-align:center;color:var(--mut);font-size:.8rem;padding:22px 0 30px}
.foot b{color:var(--acc);font-weight:700;letter-spacing:.02em}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ft{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;position:relative;user-select:none;-webkit-user-select:none}
.ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ft span{font-size:1.9rem}
.ft small{font-size:.72rem;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.88rem;min-height:36px}
.chips button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modals{position:fixed;inset:0;z-index:50;pointer-events:none}
.mwrap{position:absolute;inset:0;background:rgba(0,0,0,.76);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surf);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.mh{font-family:var(--fd);font-size:1.2rem;margin-bottom:6px;font-weight:600;word-break:break-word}
.mtext{margin:6px 0 12px;line-height:1.6}
.mact{display:flex;gap:10px;margin-top:14px}

.mwrap.out{opacity:0;transition:opacity .18s}

@keyframes fade{from{opacity:0}}
#toasts{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:520px;text-align:center;transition:opacity .3s;line-height:1.4}
.toast.bad{background:var(--bad);color:#fff}
.toast.out{opacity:0}
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;transition:opacity .35s}
#lock.gone{opacity:0;pointer-events:none}
.lockin{max-width:420px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px 30px;display:flex;flex-direction:column;align-items:center}
.langbar{align-self:stretch;display:flex;justify-content:flex-end;margin-bottom:4px}
.dialwrap{width:min(190px,48vw);margin:6px 0 12px}
.dial{width:100%;height:auto;display:block;overflow:visible}
.d-o{fill:none;stroke:var(--acc);stroke-width:2}
.d-t line{stroke:var(--acc);stroke-width:1.5;opacity:.65}
.d-i{fill:var(--surf);stroke:var(--acc);stroke-width:1.5}
.d-s line{stroke:var(--acc);stroke-width:3;stroke-linecap:round;opacity:.5}
.d-h{fill:var(--bg);stroke:var(--acc);stroke-width:2}
.d-k{fill:var(--acc)}
.d-w{transform-origin:110px 110px;transition:transform .7s cubic-bezier(.5,0,.2,1)}

.stack{display:flex;flex-direction:column;gap:6px;width:100%}

.ctitle{font-family:var(--fd);font-size:1.35rem;text-align:center}

.ob p{color:var(--mut);line-height:1.65;min-height:6.6em}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.reccode{font-family:var(--fm);font-size:1.2rem;text-align:center;padding:16px 10px;border:1px dashed var(--acc);border-radius:14px;margin:12px 0;word-break:break-all;direction:ltr;letter-spacing:.06em;color:var(--acc)}
.pdots{display:flex;gap:12px;justify-content:center;margin:14px 0;direction:ltr}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
.pdots i.on{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;direction:ltr}
.pad button{height:60px;border-radius:14px;border:1px solid var(--line);font-size:1.45rem;font-weight:600}
.pad button:active{background:var(--surf2)}
.pat{width:min(270px,78vw);display:block;margin:6px auto;touch-action:none;user-select:none;-webkit-user-select:none}
.pat .pd{fill:var(--mut)}
.pat .pd.on{fill:var(--acc)}
.pat .pr{fill:none;stroke:var(--line);stroke-width:1.5}
.pat polyline{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.viewer img,.viewer video{max-width:100%;max-height:60vh;display:block;margin:8px auto;border-radius:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{text-align:end;word-break:break-word}
.range{width:100%;accent-color:var(--acc);height:32px}
.genout{font-family:var(--fm);font-size:1.25rem;text-align:center;padding:18px 12px;border:1px solid var(--acc);border-radius:14px;word-break:break-all;direction:ltr;margin-bottom:8px;min-height:3.4em}
.score{font-family:var(--fd);font-size:2.6rem;color:var(--acc);text-align:center;line-height:1}
.hide{display:none!important}
.veil #view,.veil #lock,.veil #modals{filter:blur(24px)}
@media (min-width:600px){.fgrid{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const te=new TextEncoder(), td=new TextDecoder();
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
function b64(buf){const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
const uid=()=>Date.now().toString(36)+Array.from(rand(6),b=>b.toString(16).padStart(2,'0')).join('');

const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function fmtDate(x){if(!x)return '';const d=typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)?new Date(x+'T00:00'):new Date(x);if(isNaN(d))return String(x);return d.toLocaleDateString(CUR==='he'?'he-IL':'en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB';}

const LS={mem:{},
get(k,d){try{const v=localStorage.getItem(LSP+k);return v===null?(k in this.mem?this.mem[k]:d):JSON.parse(v);}catch(e){return k in this.mem?this.mem[k]:d;}},
set(k,v){this.mem[k]=v;try{localStorage.setItem(LSP+k,JSON.stringify(v));}catch(e){}},
del(k){delete this.mem[k];try{localStorage.removeItem(LSP+k);}catch(e){}},
clearAll(){this.mem={};try{Object.keys(localStorage).filter(k=>k.startsWith(LSP)).forEach(k=>localStorage.removeItem(k));}catch(e){}}};

/* ================= IndexedDB ================= */
// stores: meta (vault/quick/bio/devkey), items {id,iv,ct}, files {id,miv,mct,tiv,tct}, blobs {iv,ct}
const STORES=['meta','items','files','blobs'];
const DB={db:null,
open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let r;try{r=indexedDB.open(DB_NAME,1);}catch(e){rej(e);return;}
 r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s);});};
 r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>{this.db.close();this.db=null;};res(this.db);};
 r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});},
async run(stores,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(stores,mode);let out;const r=fn(t);if(r&&'onsuccess' in r)r.onsuccess=()=>{out=r.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'));});},
get(s,k){return this.run(s,'readonly',t=>t.objectStore(s).get(k));},
put(s,k,v){return this.run(s,'readwrite',t=>{t.objectStore(s).put(v,k);});},
del(s,k){return this.run(s,'readwrite',t=>{t.objectStore(s).delete(k);});},
all(s){return this.run(s,'readonly',t=>t.objectStore(s).getAll());},
count(s){return this.run(s,'readonly',t=>t.objectStore(s).count());},
async wipe(){if(this.db){this.db.close();this.db=null;}await new Promise(r=>{const q=indexedDB.deleteDatabase(DB_NAME);q.onsuccess=q.onerror=q.onblocked=()=>r();});}};

/* ================= crypto primitives ================= */
async function kdf(secret,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(norm(secret)),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function enc(key,data){const iv=rand(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);return {iv,ct};}
function dec(key,iv,ct){return crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);}
const importDEK=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function encJ(obj){return enc(S.dek,te.encode(JSON.stringify(obj)));}
async function decJ(iv,ct){return JSON.parse(td.decode(await dec(S.dek,iv,ct)));}
const REC_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 symbols → 5 bits each, 24 chars = 120 bits
function genRecovery(){const b=rand(24);let s='';for(let i=0;i<24;i++){s+=REC_ABC[b[i]&31];if(i%4===3&&i<23)s+='-';}return s;}
const normRec=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

/* ================= state ================= */
const S={dek:null,dekRaw:null,items:[],files:[],unlocked:false,stack:[],urls:[],thumbs:{},hold:0};

/* ================= vault / keys ================= */
async function createVault(pw){
 const raw=rand(32),salt=rand(16),rsalt=rand(16),code=genRecovery();
 const w=await enc(await kdf(pw,salt,KDF_ITER),raw);
 const rw=await enc(await kdf(normRec(code),rsalt,REC_ITER),raw);
 await DB.put('meta','vault',{v:1,created:Date.now(),kdf:{iter:KDF_ITER,salt},pw:{iv:w.iv,ct:w.ct},rec:{iter:REC_ITER,salt:rsalt,iv:rw.iv,ct:rw.ct}});
 return {raw,code};}
async function unwrapPw(pw){const m=await DB.get('meta','vault');const k=await kdf(pw,m.kdf.salt,m.kdf.iter);return new Uint8Array(await dec(k,m.pw.iv,m.pw.ct));}
async function unwrapRec(code){const m=await DB.get('meta','vault');const k=await kdf(normRec(code),m.rec.salt,m.rec.iter);return new Uint8Array(await dec(k,m.rec.iv,m.rec.ct));}
async function setMasterPw(raw,pw){const m=await DB.get('meta','vault');const salt=rand(16);const w=await enc(await kdf(pw,salt,KDF_ITER),raw);
 m.kdf={iter:KDF_ITER,salt};m.pw={iv:w.iv,ct:w.ct};await DB.put('meta','vault',m);}
async function newRecovery(){const m=await DB.get('meta','vault');const code=genRecovery(),rsalt=rand(16);
 const rw=await enc(await kdf(normRec(code),rsalt,REC_ITER),S.dekRaw);m.rec={iter:REC_ITER,salt:rsalt,iv:rw.iv,ct:rw.ct};await DB.put('meta','vault',m);return code;}
// device key: non-extractable, stored in IndexedDB; wraps quick-unlock blob so PIN/pattern alone is useless off-device
async function devKey(){let k=await DB.get('meta','devkey');if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await DB.put('meta','devkey',k);}return k;}
async function setQuick(kind,secret){const salt=rand(16);const inner=await enc(await kdf(kind+':'+secret,salt,QUICK_ITER),S.dekRaw);
 const packed=new Uint8Array(12+inner.ct.byteLength);packed.set(inner.iv,0);packed.set(new Uint8Array(inner.ct),12);
 const outer=await enc(await devKey(),packed);await DB.put('meta','quick',{kind,salt,iter:QUICK_ITER,iv:outer.iv,ct:outer.ct,fails:0});}
async function unlockQuick(secret){const q=await DB.get('meta','quick');if(!q)throw Object.assign(new Error('noquick'),{code:'noquick'});
 const packed=new Uint8Array(await dec(await devKey(),q.iv,q.ct));const k=await kdf(q.kind+':'+secret,q.salt,q.iter);
 try{const raw=new Uint8Array(await dec(k,packed.slice(0,12),packed.slice(12)));if(q.fails){q.fails=0;await DB.put('meta','quick',q);}return raw;}
 catch(e){q.fails=(q.fails||0)+1;if(q.fails>=5){await DB.del('meta','quick');throw Object.assign(new Error('wiped'),{code:'wiped'});}
  await DB.put('meta','quick',q);throw Object.assign(new Error('wrong'),{code:'wrong',left:5-q.fails});}}
// fingerprint = WebAuthn passkey + PRF extension → real key material (not just a yes/no gate)
async function bioAvailable(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
async function prfKey(out){const base=await crypto.subtle.importKey('raw',out,'HKDF',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:te.encode('VaultNest-bio-v1'),info:te.encode('dek-wrap')},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function bioEval(credId,psalt){const a=await navigator.credentials.get({publicKey:{challenge:rand(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:credId}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:psalt}}}}});
 const r=a.getClientExtensionResults();if(!r.prf||!r.prf.results||!r.prf.results.first)throw Object.assign(new Error('noprf'),{code:'noprf'});return r.prf.results.first;}
async function setupBio(){const cred=await navigator.credentials.create({publicKey:{rp:{name:'VaultNest',id:location.hostname},user:{id:rand(16),name:'vaultnest',displayName:'VaultNest'},challenge:rand(32),
 pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'required',requireResidentKey:true,userVerification:'required'},timeout:60000,extensions:{prf:{}}}});
 const ext=cred.getClientExtensionResults();if(ext.prf&&ext.prf.enabled===false)throw Object.assign(new Error('noprf'),{code:'noprf'});
 const credId=new Uint8Array(cred.rawId),psalt=rand(32);const w=await enc(await prfKey(await bioEval(credId,psalt)),S.dekRaw);
 await DB.put('meta','bio',{credId,psalt,iv:w.iv,ct:w.ct});}
async function unlockBio(){const b=await DB.get('meta','bio');return new Uint8Array(await dec(await prfKey(await bioEval(b.credId,b.psalt)),b.iv,b.ct));}

/* ================= data ================= */
async function loadAll(){S.items=[];S.files=[];
 for(const r of await DB.all('items')){try{S.items.push(await decJ(r.iv,r.ct));}catch(e){logErr('item decrypt');}}
 for(const r of await DB.all('files')){try{const m=await decJ(r.miv,r.mct);m.id=r.id;m.hasThumb=!!r.tct;S.files.push(m);}catch(e){logErr('file decrypt');}}
 await purgeTrash();}
async function saveItem(it){it.updated=Date.now();const {iv,ct}=await encJ(it);await DB.put('items',it.id,{id:it.id,iv,ct});
 const i=S.items.findIndex(x=>x.id===it.id);if(i>=0)S.items[i]=it;else S.items.push(it);}
async function saveFileMeta(m){const clean={name:m.name,type:m.type,size:m.size,cat:m.cat,created:m.created,deletedAt:m.deletedAt||0};
 const rec=await DB.get('files',m.id);const e=await encJ(clean);rec.miv=e.iv;rec.mct=e.ct;await DB.put('files',m.id,rec);}
async function killItem(id){await DB.del('items',id);S.items=S.items.filter(x=>x.id!==id);}
async function killFile(id){await DB.del('blobs',id);await DB.del('files',id);S.files=S.files.filter(x=>x.id!==id);if(S.thumbs[id]){URL.revokeObjectURL(S.thumbs[id]);delete S.thumbs[id];}}
async function purgeTrash(){const lim=Date.now()-30*864e5;
 for(const it of S.items.filter(x=>x.deletedAt&&x.deletedAt<lim))await killItem(it.id);
 for(const f of S.files.filter(x=>x.deletedAt&&x.deletedAt<lim))await killFile(f.id);}
const live=()=>S.items.filter(x=>!x.deletedAt);
const liveFiles=()=>S.files.filter(x=>!x.deletedAt);
async function makeThumb(file){try{const bmp=await createImageBitmap(file);const sc=Math.min(1,300/Math.max(bmp.width,bmp.height));
 const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
 c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);if(bmp.close)bmp.close();
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.72));return b?await b.arrayBuffer():null;}catch(e){return null;}}
async function addOneFile(f,cat){const buf=await f.arrayBuffer();const e=await enc(S.dek,buf);
 const th=/^image\//.test(f.type)?await makeThumb(f):null;const te2=th?await enc(S.dek,th):null;
 const id=uid();const meta={name:f.name||('photo-'+ymd()+'.jpg'),type:f.type||'application/octet-stream',size:f.size,cat,created:Date.now(),deletedAt:0};
 const m=await encJ(meta);await DB.put('blobs',id,{iv:e.iv,ct:e.ct});
 await DB.put('files',id,{id,miv:m.iv,mct:m.ct,tiv:te2?te2.iv:null,tct:te2?te2.ct:null});
 meta.id=id;meta.hasThumb=!!te2;S.files.push(meta);}
async function thumbURL(id){if(S.thumbs[id])return S.thumbs[id];const r=await DB.get('files',id);if(!r||!r.tct)return null;
 const u=URL.createObjectURL(new Blob([await dec(S.dek,r.tiv,r.tct)],{type:'image/jpeg'}));S.thumbs[id]=u;return u;}
async function fileBlob(m){const r=await DB.get('blobs',m.id);return new Blob([await dec(S.dek,r.iv,r.ct)],{type:m.type});}

/* ================= backup (fully encrypted, portable) ================= */
async function buildBackup(){const m=await DB.get('meta','vault');const items=await DB.all('items');
 const fr=await DB.all('files');const files=[];
 for(const r of fr){const bl=await DB.get('blobs',r.id);if(!bl)continue;
  files.push({id:r.id,miv:b64(r.miv),mct:b64(r.mct),tiv:r.tiv?b64(r.tiv):null,tct:r.tct?b64(r.tct):null,iv:b64(bl.iv),ct:b64(bl.ct)});}
 const out={app:'VaultNest',format:1,version:APP_VERSION,created:new Date().toISOString(),user:LS.get('user',''),
  vault:{kdf:{iter:m.kdf.iter,salt:b64(m.kdf.salt)},pw:{iv:b64(m.pw.iv),ct:b64(m.pw.ct)},rec:{iter:m.rec.iter,salt:b64(m.rec.salt),iv:b64(m.rec.iv),ct:b64(m.rec.ct)}},
  items:items.map(r=>({id:r.id,iv:b64(r.iv),ct:b64(r.ct)})),files};
 const who=(LS.get('user','')||'').replace(/[^\p{L}\p{N}_-]+/gu,'-').slice(0,20);
 return new File([JSON.stringify(out)],`vaultnest-backup-${who?who+'-':''}${ymd()}.json`,{type:'application/json'});}
function parseBackup(text){let d;try{d=JSON.parse(text);}catch(e){return null;}
 if(!d||d.app!=='VaultNest'||!d.vault||!d.vault.pw||!Array.isArray(d.items))return null;return d;}
async function unwrapBackup(d,secret,useRec){const v=useRec?d.vault.rec:d.vault.pw;const kd=useRec?{salt:d.vault.rec.salt,iter:d.vault.rec.iter}:d.vault.kdf;
 const k=await kdf(useRec?normRec(secret):secret,unb64(kd.salt),kd.iter);return new Uint8Array(await dec(k,unb64(v.iv),unb64(v.ct)));}
async function restoreBackup(d){const meta={v:1,created:Date.now(),kdf:{iter:d.vault.kdf.iter,salt:unb64(d.vault.kdf.salt)},pw:{iv:unb64(d.vault.pw.iv),ct:unb64(d.vault.pw.ct)},
  rec:{iter:d.vault.rec.iter,salt:unb64(d.vault.rec.salt),iv:unb64(d.vault.rec.iv),ct:unb64(d.vault.rec.ct)}};
 await DB.run(STORES,'readwrite',t=>{const M=t.objectStore('meta'),I=t.objectStore('items'),F=t.objectStore('files'),B=t.objectStore('blobs');
  M.put(meta,'vault');M.delete('quick');M.delete('bio');I.clear();F.clear();B.clear();
  d.items.forEach(r=>I.put({id:r.id,iv:unb64(r.iv),ct:unb64(r.ct)},r.id));
  (d.files||[]).forEach(r=>{F.put({id:r.id,miv:unb64(r.miv),mct:unb64(r.mct),tiv:r.tiv?unb64(r.tiv):null,tct:r.tct?unb64(r.tct):null},r.id);B.put({iv:unb64(r.iv),ct:unb64(r.ct)},r.id);});});}

/* ================= CSV import / export ================= */
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}
 if(f!==''||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()!==''));}
function csvToLogins(text){const rows=parseCSV(text);if(rows.length<2)return [];const h=rows[0].map(x=>x.trim().toLowerCase());
 const col=(...names)=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return i;}return -1;};
 const cT=col('name','title'),cU=col('url','login_uri','uri','website'),cN=col('username','login_username','login','email'),cP=col('password','login_password'),cX=col('note','notes','extra','comments');
 if(cP<0&&cN<0)return [];const out=[];
 for(const r of rows.slice(1)){const g=i=>i>=0&&r[i]!=null?r[i].trim():'';const pw=g(cP),un=g(cN),url=g(cU);if(!pw&&!un)continue;
  out.push({title:g(cT)||hostOf(url)||un||'—',url,username:un,password:pw,notes:g(cX)});}
 return out;}
async function importLogins(list){let n=0,s=0;const key=(u,n2,p)=>[hostOf(u),n2,p].join('\u0001');
 const have=new Set(live().filter(x=>x.type==='login').map(x=>key(x.f.url,x.f.username,x.f.password)));
 for(const l of list){const k=key(l.url,l.username,l.password);if(have.has(k)){s++;continue;}have.add(k);
  await saveItem({id:uid(),type:'login',title:l.title,fav:false,created:Date.now(),pwChanged:Date.now(),f:{username:l.username,password:l.password,url:l.url,notes:l.notes}});n++;}
 return {n,s};}
function loginsCSV(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const L=live().filter(x=>x.type==='login');
 return {n:L.length,text:'name,url,username,password,note\n'+L.map(x=>[x.title,x.f.url,x.f.username,x.f.password,x.f.notes].map(q).join(',')).join('\n')};}

/* ================= passwords: generator, strength, leaks ================= */
function genPw(o){let L='abcdefghijklmnopqrstuvwxyz',U='ABCDEFGHIJKLMNOPQRSTUVWXYZ',D='0123456789',Y='!@#$%^&*()-_=+[]{};:,.?/~';
 if(o.ambig){L=L.replace(/[lo]/g,'');U=U.replace(/[IO]/g,'');D=D.replace(/[01]/g,'');}
 const sets=[];if(o.lower)sets.push(L);if(o.upper)sets.push(U);if(o.digits)sets.push(D);if(o.symbols)sets.push(Y);if(!sets.length)sets.push(L);
 const all=sets.join('');const out=sets.map(s=>s[randInt(s.length)]);while(out.length<o.len)out.push(all[randInt(all.length)]);
 for(let i=out.length-1;i>0;i--){const j=randInt(i+1);[out[i],out[j]]=[out[j],out[i]];}return out.slice(0,o.len).join('');}
const genOpts=()=>Object.assign({len:20,lower:true,upper:true,digits:true,symbols:true,ambig:false},LS.get('genopt',{}));
const COMMON=['password','passw0rd','123456','12345','qwerty','abc123','111111','iloveyou','admin','welcome','monkey','dragon','letmein','football','000000','1q2w3e','zxcvbn','asdfgh','superman','sunshine','princess','shalom','israel','qazwsx','654321','123123','master','login'];
function strength(pw){if(!pw)return {s:0,bits:0};let pool=0;
 if(/[a-z]/.test(pw))pool+=26;if(/[A-Z]/.test(pw))pool+=26;if(/[0-9]/.test(pw))pool+=10;if(/[^a-zA-Z0-9\u0590-\u05FF]/.test(pw))pool+=33;if(/[\u0590-\u05FF]/.test(pw))pool+=27;
 let bits=[...pw].length*Math.log2(Math.max(pool,2));const low=pw.toLowerCase();
 const hit=COMMON.filter(c=>low.includes(c)).reduce((a,c)=>Math.max(a,c.length),0);if(hit)bits*=Math.max(.25,1-hit/pw.length);
 if(/(.)\1{2,}/.test(pw))bits*=.8;if(/(0123|1234|2345|3456|4567|5678|6789|abcd|bcde|qwer|asdf)/i.test(pw))bits*=.8;
 if(new Set(pw).size<pw.length/2)bits*=.75;bits=Math.round(bits);
 return {bits,s:bits<28?0:bits<40?1:bits<60?2:bits<80?3:4};}
const STR_COL=['var(--bad)','var(--bad)','var(--warn)','var(--ok)','var(--ok)'];
async function pwnedCount(pw){const h=await crypto.subtle.digest('SHA-1',te.encode(pw));
 const hex=Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
 const r=await fetch('https://api.pwnedpasswords.com/range/'+hex.slice(0,5),{referrerPolicy:'no-referrer',cache:'no-store',credentials:'omit'});
 if(!r.ok)throw new Error('http '+r.status);const suf=hex.slice(5);
 for(const line of (await r.text()).split('\n')){const [s,c]=line.trim().split(':');if(s===suf)return parseInt(c,10)||0;}return 0;}

function modal(html,o={}){return new Promise(res=>{const w=document.createElement('div');w.className='mwrap';
 w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;$('#modals').appendChild(w);const prev=document.activeElement;let done=false;
 const close=v=>{if(done)return;done=true;w.classList.add('out');document.removeEventListener('keydown',onKey);setTimeout(()=>w.remove(),180);if(o.onClose)o.onClose();try{prev&&prev.focus&&prev.focus();}catch(e){}res(v===undefined?null:v);};

  if(e.key==='Tab'){const f=$$('button,input,select,textarea,a[href],video,audio',w).filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;
   if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}}};
 document.addEventListener('keydown',onKey);w.addEventListener('click',e=>{if(e.target===w&&!o.sticky)close(null);});w._close=close;

/* ================= PIN pad & pattern ================= */
function pinPad(title,sub){let v='';
 return modal(`<h3 class="mh" style="text-align:center">${esc(title)}</h3><p class="mtext" id="pmsg" style="text-align:center;min-height:1.6em">${esc(sub||'')}</p>
 <div class="pdots">${'<i></i>'.repeat(6)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-a="x" aria-label="${T('cancel')}">✕</button><button data-n="0">0</button><button data-a="del" aria-label="${T('delete')}">⌫</button></div>`,
 {sticky:true,onOpen:(s,close)=>{const dots=$$('.pdots i',s);const draw=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<v.length));
  const press=n=>{if(v.length<6){v+=n;draw();if(v.length===6)setTimeout(()=>close(v),120);}};
  $$('[data-n]',s).forEach(b=>b.onclick=()=>press(b.dataset.n));$('[data-a=del]',s).onclick=()=>{v=v.slice(0,-1);draw();};$('[data-a=x]',s).onclick=()=>close(null);
  s.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace'){v=v.slice(0,-1);draw();}});}});}
function patternPad(title,sub){const P=[50,150,250];let dots='';for(let i=0;i<9;i++){const x=P[i%3],y=P[(i/3)|0];dots+=`<circle class="pr" cx="${x}" cy="${y}" r="30"/><circle class="pd" data-i="${i}" cx="${x}" cy="${y}" r="10"/>`;}
 return modal(`<h3 class="mh" style="text-align:center">${esc(title)}</h3><p class="mtext" id="pmsg" style="text-align:center;min-height:1.6em">${esc(sub||'')}</p>
 <svg class="pat" viewBox="0 0 300 300" role="img" aria-label="${esc(title)}"><polyline points=""/>${dots}</svg><div class="mact"><button class="btn" data-a="x">${T('cancel')}</button></div>`,
 {sticky:true,onOpen:(s,close)=>{const svg=$('svg',s),pl=$('polyline',s),msg=$('#pmsg',s);let seq=[],down=false,cur=null;
  const pt=e=>{const r=svg.getBoundingClientRect();return {x:(e.clientX-r.left)*300/r.width,y:(e.clientY-r.top)*300/r.height};};
  const redraw=()=>{pl.setAttribute('points',seq.map(i=>P[i%3]+','+P[(i/3)|0]).concat(cur?[cur.x+','+cur.y]:[]).join(' '));$$('.pd',s).forEach(c=>c.classList.toggle('on',seq.includes(+c.dataset.i)));};
  const add=i=>{if(seq.includes(i))return;const last=seq[seq.length-1];
   if(last!=null){const ra=(last/3)|0,ca=last%3,rb=(i/3)|0,cb=i%3;if((ra+rb)%2===0&&(ca+cb)%2===0){const mid=((ra+rb)/2)*3+(ca+cb)/2;if(!seq.includes(mid))seq.push(mid);}}
   seq.push(i);if(navigator.vibrate)navigator.vibrate(8);};
  const hit=p=>{for(let i=0;i<9;i++){const dx=p.x-P[i%3],dy=p.y-P[(i/3)|0];if(dx*dx+dy*dy<34*34)return i;}return -1;};
  svg.addEventListener('pointerdown',e=>{down=true;seq=[];try{svg.setPointerCapture(e.pointerId);}catch(x){}const p=pt(e),h=hit(p);if(h>=0)add(h);cur=p;redraw();});
  svg.addEventListener('pointermove',e=>{if(!down)return;const p=pt(e),h=hit(p);if(h>=0)add(h);cur=p;redraw();});
  const up=()=>{if(!down)return;down=false;cur=null;redraw();
   if(seq.length<4){msg.textContent=T('pat_short');setTimeout(()=>{seq=[];redraw();},500);return;}const out=seq.join('');setTimeout(()=>close(out),150);};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);$('[data-a=x]',s).onclick=()=>close(null);}});}

 $$('#modals .mwrap').forEach(w=>w._close&&w._close(null));$('#modals').innerHTML='';$('#view').innerHTML='';clearTimeout(idleT);

const TYPES={
 login:{ic:'🔑',f:[['username','text'],['password','secret',{gen:1,pw:1}],['url','url'],['notes','area']]},
 card:{ic:'💳',f:[['cardholder','text'],['number','secret',{num:1,card:1}],['expiry','text',{ph:'MM/YY',exp:1}],['cvv','secret',{num:1}],['cardPin','secret',{num:1}],['issuer','text'],['notes','area']]},
 code:{ic:'🔢',f:[['code','secret'],['notes','area']]},
 wifi:{ic:'📶',f:[['ssid','text'],['password','secret',{gen:1,pw:1}],['security','select',{opts:['WPA2/WPA3','WPA','WEP','none']}],['notes','area']]},
 bank:{ic:'🏦',f:[['bankName','text'],['branch','text'],['account','secret'],['username','text'],['password','secret',{gen:1,pw:1}],['url','url'],['notes','area']]},
 identity:{ic:'🪪',f:[['docType','text'],['fullName','text'],['docNumber','secret'],['issued','date'],['docExpiry','date'],['notes','area']]},
 note:{ic:'📝',f:[['notes','area',{hidden:1}]]}};
const TYPE_ORDER=['login','card','code','wifi','bank','identity','note'];
const FCATS=['id','money','home','car','health','other'];
const THEMES=[['gold','#000','#C9A24A'],['silver','#000','#C3CAD3'],['copper','#0A1523','#D38C4F'],['jade','#071A12','#63C79C'],['ruby','#19060B','#E3B27C']];
const grp4=v=>String(v||'').replace(/\s+/g,'').replace(/(.{4})(?=.)/g,'$1 ');
const ficon=t=>/^image\//.test(t)?'🖼️':/pdf/.test(t)?'📄':/^video\//.test(t)?'🎞️':/^audio\//.test(t)?'🎵':'📎';
function subtitle(it){const f=it.f||{};switch(it.type){
 case 'login':return f.username||hostOf(f.url)||'';case 'card':return (f.number?'•••• '+String(f.number).replace(/\s/g,'').slice(-4):'')+(f.expiry?'  '+f.expiry:'');
 case 'wifi':return f.ssid||'';case 'bank':return [f.bankName,f.branch].filter(Boolean).join(' · ');case 'identity':return [f.docType,f.docExpiry?fmtDate(f.docExpiry):''].filter(Boolean).join(' · ');
 default:return T('updated_at',{d:fmtDate(it.updated)});}}
function expInfo(it){let d=null;if(it.type==='card'&&it.f.expiry){const m=/^(\d{1,2})\s*\/\s*(\d{2,4})$/.exec(it.f.expiry.trim());if(m){let y=+m[2];if(y<100)y+=2000;d=new Date(y,+m[1],0,23,59);}}
 if(it.type==='identity'&&it.f.docExpiry)d=new Date(it.f.docExpiry+'T23:59');if(!d||isNaN(d))return null;
 const days=Math.ceil((d-Date.now())/864e5);const lim=it.type==='card'?60:120;if(days<0)return {past:true,days};if(days<=lim)return {past:false,days};return null;}
const pwFieldsOf=it=>(TYPES[it.type]||{f:[]}).f.filter(x=>x[2]&&x[2].pw&&it.f[x[0]]).map(x=>it.f[x[0]]);
function reuseMap(){const m=new Map();live().forEach(it=>pwFieldsOf(it).forEach(p=>{m.set(p,(m.get(p)||0)+1);}));return m;}

function go(view,params={},reset){if(reset){S.stack=[{view,params}];try{history.replaceState({vn:1},'');}catch(e){}}
 else{S.stack.push({view,params});try{history.pushState({vn:S.stack.length},'');}catch(e){}}render();window.scrollTo(0,0);}

window.addEventListener('popstate',()=>{const m=$('#modals').lastElementChild;if(m&&m._close){m._close(null);try{history.pushState({vn:S.stack.length},'');}catch(e){}return;}
 if(S.unlocked&&S.stack.length>1)popView();});

 V.innerHTML='';(VIEWS[cur.view]||VIEWS.home)(cur.params||{},V);if(keep)window.scrollTo(0,y);}

 <h3 class="sec">${T('s_danger')}</h3><button class="btn danger wide" id="sreset">${T('reset_all')}</button>${foot()}</main>`;
 wire(V);lookControls($('#slook',V));
 $('#suser',V).oninput=e=>LS.set('user',e.target.value.slice(0,40));
 $$('[data-lang]',V).forEach(b=>b.onclick=()=>{setLang(b.dataset.lang);rerender();});
 $$('[data-al]',V).forEach(b=>b.onclick=()=>{LS.set('autolock',+b.dataset.al);rerender();});
 $$('[data-cl]',V).forEach(b=>b.onclick=()=>{LS.set('clip',+b.dataset.cl);rerender();});
 const sb=$('#sbio',V);if(sb)sb.onclick=async()=>{if(!(await bioAvailable())){toast(T('bio_unsupported'),'bad');return;}doSetupBio();};
 const sbx=$('#sbiox',V);if(sbx)sbx.onclick=async()=>{await DB.del('meta','bio');toast(T('bio_removed'));rerender();};
 $('#sqpin',V).onclick=()=>doSetupQuick('pin');$('#sqpat',V).onclick=()=>doSetupQuick('pattern');
 const sqx=$('#sqx',V);if(sqx)sqx.onclick=async()=>{await DB.del('meta','quick');toast(T('q_removed'));rerender();};
 $('#schpw',V).onclick=changePwDlg;
 $('#srec',V).onclick=async()=>{if(!(await confirmDlg(T('new_rec_c'))))return;const code=await newRecovery();
  await modal(`<h3 class="mh">${T('rec_t')}</h3><p class="mtext">${T('rec_d')}</p><div class="reccode">${esc(code)}</div><button class="btn wide" id="nrc">⧉ ${T('rec_copy')}</button>
  <label class="chk"><input type="checkbox" id="nrk"> ${T('rec_check')}</label><div class="mact"><button class="btn pri" id="nrg" disabled>${T('done')}</button></div>`,
  {sticky:true,onOpen:(s,close)=>{$('#nrc',s).onclick=()=>copyText(code);$('#nrk',s).onchange=e=>{$('#nrg',s).disabled=!e.target.checked;};$('#nrg',s).onclick=()=>close();}});};
 $('#sbk',V).onclick=backupDlg;$('#srs',V).onclick=restoreFlow;
 $('#scsv',V).onclick=async()=>{const [f]=await pickFile($('#fcsv'));if(!f)return;const list=csvToLogins(await f.text());if(!list.length){toast(T('csv_none'),'bad');return;}
  const r=await importLogins(list);toast(T('csv_done',r));await confirmDlg(T('csv_delete_hint'),{ok:T('confirm'),no:T('close')});rerender();};
 $('#scsvx',V).onclick=async()=>{const w=T('export_word');const a=await promptDlg(T('csv_export_t'),{text:T('csv_export_warn',{w}),danger:true,ok:T('csv_export')});
  if(a==null||a.trim()!==w)return;const {n,text}=loginsCSV();saveFile(new File(['\uFEFF'+text],`vaultnest-passwords-PLAINTEXT-${ymd()}.csv`,{type:'text/csv'}));toast(T('csv_exported',{n}));};
 $('#sguide',V).onclick=()=>modal('<div id="gh"></div>',{onOpen:(s,close)=>obSlides($('#gh',s),()=>close(),false)});
 $('#sreset',V).onclick=async()=>{if(!(await confirmDlg(T('reset_c1'),{danger:true,ok:T('delete')})))return;const w=T('reset_word');
  const a=await promptDlg(T('reset_c2',{w}),{danger:true,ok:T('delete')});if(a==null||a.trim()!==w)return;
  S.unlocked=false;if(S.dekRaw)S.dekRaw.fill(0);S.dekRaw=null;S.dek=null;$('#view').innerHTML='';await DB.wipe();LS.clearAll();toast(T('reset_done'));setTimeout(()=>location.reload(),700);};
 if(S.keepY!=null)window.scrollTo(0,S.keepY);};
function changePwDlg(){return modal(`<h3 class="mh">${T('s_change_pw')}</h3><label class="lbl" for="chc">${T('cur_pw')}</label><div class="pwbox"><input id="chc" class="inp" type="password" dir="ltr" autocomplete="current-password" autofocus><button type="button" class="eye" data-eye="chc">👁</button></div>
 ${pwFields('ch')}<div class="err" id="cherr" role="alert"></div><div class="mact"><button class="btn" data-a="x">${T('cancel')}</button><button class="btn pri" data-a="s">${T('save')}</button></div>`,
 {sticky:true,onOpen:(s,close)=>{bindMeter($('#ch1',s),$('#chm',s),$('#chml',s));$('[data-a=x]',s).onclick=()=>close();
  $('[data-a=s]',s).onclick=async()=>{const err=$('#cherr',s);try{const raw=await unwrapPw($('#chc',s).value);raw.fill(0);}catch(e){err.textContent=T('wrong_pw');return;}
   const pw=await readPwFields(s,'ch',err);if(!pw)return;await setMasterPw(S.dekRaw,pw);toast(T('pw_changed'));close();};}});}

VIEWS.about=async(p,V)=>{const errs=JSON.parse(localStorage.getItem(LSP+'errlog')||'[]');
 V.innerHTML=`${topbar(T('about'))}<main class="wrap"><div style="text-align:center;margin:10px 0 18px"><div class="dialwrap" style="margin:0 auto 8px;width:110px">${dialSVG()}</div>
 <h2 style="font-family:var(--fd);color:var(--acc);font-size:1.6rem">VaultNest</h2><p class="mlbl">${T('app_sub')} · ${T('ab_version')} ${APP_VERSION}</p></div>
 <div class="card"><div class="kv"><span>${T('ab_version')}</span><span>${APP_VERSION}</span></div><div class="kv"><span>${T('ab_dev')}</span><span>Barak Aflalo</span></div>
 <div class="kv"><span>${T('ab_platform')}</span><span>PWA · HTML5</span></div><div class="kv"><span>${T('ab_storage')}</span><span>${T('ab_storage_v')}</span></div><div class="kv"><span>${T('ab_license')}</span><span>© AppNest 2026</span></div></div>

 <button class="btn" id="aguide">📖 ${T('s_guide')}</button><a class="btn" href="privacy_policy.html" target="_blank" rel="noopener" style="text-decoration:none">🔒 ${T('s_privacy')}</a></div>
 <div class="card" style="margin-top:14px"><p class="mlbl" style="margin:0">${T('ab_disclaimer')}</p></div>

 wire(V);$('#ashare',V).onclick=async()=>{const u=location.origin+location.pathname;const txt='VaultNest — '+T('app_sub')+(LS.get('user','')?' ('+LS.get('user','')+')':'');

 $('#aguide',V).onclick=()=>modal('<div id="gh"></div>',{onOpen:(s,close)=>obSlides($('#gh',s),()=>close(),false)});
 $('#adiag',V).onclick=async()=>{let pers='?',sw='none';try{pers=await navigator.storage.persisted();}catch(e){}if(navigator.serviceWorker&&navigator.serviceWorker.controller)sw='active';

  await modal(`<h3 class="mh">${T('ab_diag')}</h3><pre class="card mono" style="white-space:pre-wrap;font-size:.78rem;direction:ltr;text-align:left">${esc(rep)}</pre><div class="mact"><button class="btn" data-v="c">⧉ ${T('copy')}</button><button class="btn pri" data-v="x">${T('close')}</button></div>`,
   {onOpen:(s,close)=>{$('[data-v=c]',s).onclick=()=>copyText(rep);$('[data-v=x]',s).onclick=()=>close();}});};};

/* ================= prefs & boot ================= */
function setLang(c){CUR=LANG[c]?c:'en';LS.set('lang',CUR);const h=document.documentElement;h.lang=CUR;h.dir=RTL.includes(CUR)?'rtl':'ltr';const sk=$('.skip');if(sk)sk.textContent=T('skip_link');}
function applyLook(){const h=document.documentElement;h.dataset.theme=LS.get('theme','gold');h.dataset.mode=LS.get('mode','night');
 const bg=getComputedStyle(h).getPropertyValue('--bg').trim()||'#000';const m=$('meta[name=theme-color]');if(m)m.content=bg;}
function detectLang(){const n=(navigator.language||'he').slice(0,2).toLowerCase();return LANG[n]?n:(n==='iw'?'he':'en');}
async function boot(){setLang(LS.get('lang',detectLang()));applyLook();
 if(location.protocol==='file:'){fatal(T('fatal_file'));return;}
 if(!window.crypto||!crypto.subtle||!window.indexedDB){fatal(T('fatal_crypto'));return;}
 try{await DB.open();}catch(e){fatal(T('fatal_storage'));return;}
 const meta=await DB.get('meta','vault');if(meta)showUnlock();else if(LS.get('onboarded',false))showCreate();else showOnboard();
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(e=>logErr('sw '+e.message));}
boot();
